name: Release Blazma Boost

permissions:
  contents: write

on:
  workflow_dispatch:

jobs:
  release:
    runs-on: windows-latest
    env:
      # A step's own env is not visible to its "if", so whether a certificate exists is decided here
      HAS_CERTIFICATE: ${{ secrets.CERTIFICATE_BASE64 != '' }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      # A later release on the same day gets .2, .3 ... so every release has its own tag and the
      # update banner can tell them apart
      - name: Pick the version
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $date = Get-Date -Format "yy.MM.dd"
          $tags = @(gh api "repos/$env:GITHUB_REPOSITORY/tags?per_page=100" --jq '.[].name')
          $version = $date
          $n = 2
          while ($tags -contains $version) {
            $version = "$date.$n"
            $n++
          }
          echo "VERSION=$version" >> $env:GITHUB_ENV
          echo "BLAZMA_VERSION=$version" >> $env:GITHUB_ENV

      - name: Compile project
        shell: pwsh
        run: |
          Set-ExecutionPolicy Bypass -Scope Process -Force; ./Compile.ps1

      # Signing is optional: add the secrets CERTIFICATE_BASE64 (a .pfx encoded as base64) and
      # CERTIFICATE_PASSWORD to the repository to have every release signed
      - name: Sign winutil.ps1
        if: ${{ env.HAS_CERTIFICATE == 'true' }}
        shell: pwsh
        env:
          CERTIFICATE_BASE64: ${{ secrets.CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.CERTIFICATE_PASSWORD }}
        run: |
          $pfxPath = Join-Path $env:RUNNER_TEMP "signing.pfx"
          [IO.File]::WriteAllBytes($pfxPath, [Convert]::FromBase64String($env:CERTIFICATE_BASE64))
          $certificate = [System.Security.Cryptography.X509Certificates.X509Certificate2]::new($pfxPath, $env:CERTIFICATE_PASSWORD)
          $result = Set-AuthenticodeSignature -FilePath ./winutil.ps1 -Certificate $certificate -TimestampServer "http://timestamp.digicert.com" -HashAlgorithm SHA256
          Remove-Item $pfxPath -Force
          if ($result.Status -ne "Valid") { throw "Signing failed: $($result.StatusMessage)" }

      - name: Create release and upload winutil.ps1
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.VERSION }}
          name: Blazma Boost ${{ env.VERSION }}
          generate_release_notes: true
          files: ./winutil.ps1
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
